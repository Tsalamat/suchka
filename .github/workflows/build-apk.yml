name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust unit tests
        run: cargo test --release
        working-directory: rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name lane_detector --org com.example /tmp/gen
          cp -r /tmp/gen/android ./android

      - name: Patch Android (camera permission, minSdk)
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="true"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E 's/minSdk(Version)?\s*=?\s*flutter\.minSdkVersion/minSdk = 24/' "$f" || true
          done
          sed -i 's/android:label="[^"]*"/android:label="Lane Detector"/' android/app/src/main/AndroidManifest.xml
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Build Rust library for Android
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o ../android/app/src/main/jniLibs build --release
        working-directory: rust

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: lane-detector-apk
          path: build/app/outputs/flutter-apk/app-release.apk
